<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeakUp — 영어 발음 트레이너</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0f11;
  --surface: #16181c;
  --surface2: #1e2026;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.14);
  --text: #f0f0ee;
  --muted: #8a8d94;
  --accent: #c8f55a;
  --accent-dim: rgba(200,245,90,0.12);
  --accent-border: rgba(200,245,90,0.3);
  --red: #ff5f5f;
  --red-dim: rgba(255,95,95,0.12);
  --amber: #ffb347;
  --amber-dim: rgba(255,179,71,0.12);
  --green: #5adf8c;
  --green-dim: rgba(90,223,140,0.12);
  --radius: 14px;
  --radius-sm: 8px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-weight: 300;
  min-height: 100vh;
  overflow-x: hidden;
}

/* bg grain */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events: none; z-index: 0;
}

.wrap { max-width: 680px; margin: 0 auto; padding: 2rem 1.25rem 4rem; position: relative; z-index: 1; }

/* header */
header { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 2.5rem; }
.logo { font-family: 'DM Serif Display', serif; font-size: 1.75rem; letter-spacing: -0.02em; }
.logo span { color: var(--accent); }
.tagline { font-size: 0.78rem; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }

/* tabs */
.tabs { display: flex; gap: 6px; margin-bottom: 1.75rem; background: var(--surface); padding: 5px; border-radius: var(--radius); border: 1px solid var(--border); }
.tab { flex: 1; padding: 9px 0; border-radius: 10px; border: none; background: transparent; cursor: pointer; font-size: 0.82rem; font-family: 'DM Sans', sans-serif; color: var(--muted); transition: all 0.2s; letter-spacing: 0.01em; }
.tab.active { background: var(--surface2); color: var(--text); font-weight: 500; border: 1px solid var(--border2); }
.tab:hover:not(.active) { color: var(--text); }

/* card */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 1.75rem;
  margin-bottom: 1rem;
  transition: border-color 0.2s;
}
.card:hover { border-color: var(--border2); }

/* badge */
.badge { display: inline-block; font-size: 0.7rem; padding: 2px 10px; border-radius: 20px; margin-bottom: 1rem; letter-spacing: 0.04em; text-transform: uppercase; font-weight: 500; }
.badge-easy { background: var(--green-dim); color: var(--green); border: 1px solid rgba(90,223,140,0.25); }
.badge-mid  { background: var(--amber-dim); color: var(--amber); border: 1px solid rgba(255,179,71,0.25); }
.badge-hard { background: var(--red-dim); color: var(--red); border: 1px solid rgba(255,95,95,0.25); }

/* sentence */
.sentence-en {
  font-family: 'DM Serif Display', serif;
  font-size: 1.6rem;
  line-height: 1.35;
  color: var(--text);
  margin-bottom: 0.5rem;
  letter-spacing: -0.01em;
}
.sentence-kr { font-size: 0.9rem; color: var(--muted); display: none; }
.sentence-kr.show { display: block; }

/* progress */
.prog-line { font-size: 0.78rem; color: var(--muted); margin-bottom: 1rem; letter-spacing: 0.04em; }
.prog-bar { height: 2px; background: var(--surface2); border-radius: 2px; margin-bottom: 1.5rem; overflow: hidden; }
.prog-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.4s ease; }

/* speed row */
.speed-row { display: flex; align-items: center; gap: 10px; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); }
.speed-row label { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
.speed-row input[type=range] {
  flex: 1; -webkit-appearance: none; height: 3px;
  background: var(--surface2); border-radius: 2px; outline: none;
}
.speed-row input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px;
  background: var(--accent); border-radius: 50%; cursor: pointer;
}
.speed-row span { font-size: 0.78rem; color: var(--muted); min-width: 30px; text-align: right; }

/* controls */
.controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn {
  padding: 9px 18px; border-radius: var(--radius-sm);
  border: 1px solid var(--border2); background: transparent;
  cursor: pointer; font-size: 0.82rem; color: var(--text);
  font-family: 'DM Sans', sans-serif; font-weight: 400;
  transition: all 0.18s; letter-spacing: 0.01em;
}
.btn:hover { background: var(--surface2); border-color: rgba(255,255,255,0.2); }
.btn-accent { background: var(--accent); color: #0e0f11; border-color: transparent; font-weight: 500; }
.btn-accent:hover { background: #d4f76a; border-color: transparent; }
.btn-icon { display: inline-flex; align-items: center; gap: 7px; }
.btn-icon svg { width: 16px; height: 16px; flex-shrink: 0; }

/* mic button states */
.btn-mic { transition: all 0.18s; }
.btn-mic.recording {
  background: var(--red-dim); border-color: var(--red); color: var(--red);
  animation: mic-pulse 1.2s infinite;
}
@keyframes mic-pulse { 0%,100%{box-shadow:0 0 0 0 rgba(255,95,95,0.3)} 50%{box-shadow:0 0 0 6px rgba(255,95,95,0)} }
.btn-tts.playing { background: var(--accent-dim); border-color: var(--accent-border); color: var(--accent); }

/* mic area */
.mic-area {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 1.25rem 1.5rem; margin-top: 1rem;
}
.mic-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.6rem; }
.transcript { font-size: 1rem; color: var(--muted); min-height: 28px; line-height: 1.5; transition: color 0.2s; }
.transcript.active { color: var(--text); }

/* score */
.score-area { margin-top: 1rem; animation: fadein 0.3s ease; }
@keyframes fadein { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }
.score-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
.score-num { font-family: 'DM Serif Display', serif; font-size: 3rem; line-height: 1; }
.score-num.perfect { color: var(--green); }
.score-num.good    { color: var(--amber); }
.score-num.poor    { color: var(--red); }
.score-meta { }
.score-meta .label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.score-meta .desc { font-size: 0.85rem; color: var(--text); margin-top: 2px; }

.word-diff { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 0.75rem; }
.wd { padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; }
.wd-ok    { background: var(--green-dim); color: var(--green); }
.wd-wrong { background: var(--red-dim); color: var(--red); text-decoration: line-through; }

.feedback {
  font-size: 0.85rem; line-height: 1.65; color: var(--muted);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 1rem 1.25rem;
}
.feedback strong { color: var(--text); font-weight: 500; }

/* translate tab */
.tr-input-row { display: flex; gap: 8px; margin-top: 1rem; }
.tr-input-row input {
  flex: 1; background: var(--surface2); border: 1px solid var(--border2);
  border-radius: var(--radius-sm); padding: 9px 14px; color: var(--text);
  font-family: 'DM Sans', sans-serif; font-size: 0.9rem; outline: none;
  transition: border-color 0.2s;
}
.tr-input-row input:focus { border-color: rgba(255,255,255,0.3); }
.tr-input-row input::placeholder { color: var(--muted); }

.result { margin-top: 0.75rem; padding: 0.75rem 1rem; border-radius: var(--radius-sm); font-size: 0.85rem; display: none; }
.result.show { display: block; }
.result.correct { background: var(--green-dim); color: var(--green); }
.result.wrong   { background: var(--red-dim); color: var(--red); }
.result.neutral { background: var(--surface2); color: var(--muted); }

/* word order tab */
.assembled {
  min-height: 50px; border: 1px dashed var(--border2);
  border-radius: var(--radius-sm); padding: 10px 14px;
  display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
  margin-bottom: 0.75rem;
}
.assembled-empty { font-size: 0.82rem; color: var(--muted); }
.a-word {
  background: var(--surface2); border: 1px solid var(--border2);
  padding: 4px 12px; border-radius: 20px; font-size: 0.85rem;
  cursor: pointer; color: var(--text); transition: all 0.15s;
}
.a-word:hover { border-color: var(--red); color: var(--red); }
.chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 1rem; }
.chip {
  background: var(--surface); border: 1px solid var(--border2);
  padding: 5px 14px; border-radius: 20px; font-size: 0.85rem;
  cursor: pointer; color: var(--text); transition: all 0.15s;
}
.chip:hover:not(.used) { border-color: var(--accent-border); color: var(--accent); }
.chip.used { opacity: 0.25; pointer-events: none; }

/* no-support */
.no-support { padding: 1rem; background: var(--amber-dim); border: 1px solid rgba(255,179,71,0.25); border-radius: var(--radius-sm); font-size: 0.85rem; color: var(--amber); margin-top: 0.75rem; }

/* footer */
footer { text-align: center; margin-top: 3rem; font-size: 0.75rem; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">Speak<span>Up</span></div>
    <div class="tagline">영어 발음 트레이너</div>
  </header>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('pronun')">🎤 발음 연습</button>
    <button class="tab" onclick="switchTab('flash')">📖 플래시카드</button>
    <button class="tab" onclick="switchTab('translate')">✏️ 번역 연습</button>
    <button class="tab" onclick="switchTab('order')">🔀 어순 맞추기</button>
  </div>

  <!-- 발음 연습 -->
  <div id="tab-pronun">
    <div class="prog-line" id="pr-prog-line"></div>
    <div class="prog-bar"><div class="prog-fill" id="pr-prog-fill"></div></div>
    <div class="card">
      <span id="pr-badge" class="badge"></span>
      <div class="sentence-en" id="pr-en"></div>
      <div class="sentence-kr show" id="pr-kr"></div>
      <div class="speed-row">
        <label>재생 속도</label>
        <input type="range" id="pr-speed" min="0.5" max="1.5" step="0.1" value="0.9"
          oninput="document.getElementById('pr-speed-val').textContent=parseFloat(this.value).toFixed(1)+'x'">
        <span id="pr-speed-val">0.9x</span>
      </div>
    </div>
    <div class="controls" style="margin-bottom:1rem">
      <button class="btn btn-icon btn-tts" id="pr-tts-btn" onclick="speakPronun()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
        원어민 듣기
      </button>
      <button class="btn btn-icon btn-mic" id="pr-mic-btn" onclick="toggleMic()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v4M8 22h8"/></svg>
        따라 말하기
      </button>
      <button class="btn" onclick="nextPronun()">다음 →</button>
    </div>
    <div class="mic-area">
      <div class="mic-label">인식된 내용</div>
      <div class="transcript" id="pr-transcript">마이크 버튼을 누르고 문장을 말해보세요.</div>
    </div>
    <div id="score-area" style="display:none" class="score-area">
      <div class="card" style="margin-top:1rem">
        <div class="score-row">
          <div class="score-num" id="score-num"></div>
          <div class="score-meta">
            <div class="label">발음 정확도</div>
            <div class="desc" id="score-desc"></div>
          </div>
          <button class="btn btn-icon btn-tts" id="pr-tts-again" onclick="speakPronun()" style="margin-left:auto">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 12a9 9 0 1018 0 9 9 0 00-18 0"/><path d="M12 8v4l3 3"/></svg>
            다시 듣기
          </button>
        </div>
        <div class="word-diff" id="word-diff"></div>
        <div class="feedback" id="feedback"></div>
      </div>
    </div>
  </div>

  <!-- 플래시카드 -->
  <div id="tab-flash" style="display:none">
    <div class="prog-line" id="fl-prog-line"></div>
    <div class="prog-bar"><div class="prog-fill" id="fl-prog-fill"></div></div>
    <div class="card">
      <span id="fl-badge" class="badge"></span>
      <div class="sentence-en" id="fl-en"></div>
      <div class="sentence-kr" id="fl-kr"></div>
      <div class="speed-row">
        <label>재생 속도</label>
        <input type="range" id="fl-speed" min="0.5" max="1.5" step="0.1" value="0.9"
          oninput="document.getElementById('fl-speed-val').textContent=parseFloat(this.value).toFixed(1)+'x'">
        <span id="fl-speed-val">0.9x</span>
      </div>
    </div>
    <div class="controls">
      <button class="btn btn-icon btn-tts" id="fl-tts-btn" onclick="speakFlash()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
        원어민 듣기
      </button>
      <button class="btn" onclick="toggleFlKr()">한국어 보기</button>
      <button class="btn" onclick="nextFlash()">다음 →</button>
    </div>
  </div>

  <!-- 번역 연습 -->
  <div id="tab-translate" style="display:none">
    <div class="prog-line" id="tr-prog-line"></div>
    <div class="prog-bar"><div class="prog-fill" id="tr-prog-fill"></div></div>
    <div class="card">
      <div style="font-size:0.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.75rem">한국어 → 영어</div>
      <div class="sentence-en" id="tr-kr" style="font-size:1.3rem"></div>
      <div class="tr-input-row">
        <input type="text" id="tr-input" placeholder="영어로 입력하고 Enter..." onkeydown="if(event.key==='Enter')checkTr()">
        <button class="btn btn-accent" onclick="checkTr()">확인</button>
      </div>
      <div class="result" id="tr-result"></div>
      <div class="controls" style="margin-top:.75rem">
        <button class="btn btn-icon btn-tts" id="tr-tts-btn" onclick="speakTr()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
          정답 듣기
        </button>
        <button class="btn" onclick="showTrAnswer()">정답 보기</button>
        <button class="btn" onclick="nextTr()">다음 →</button>
      </div>
    </div>
  </div>

  <!-- 어순 맞추기 -->
  <div id="tab-order" style="display:none">
    <div class="prog-line" id="ord-prog-line"></div>
    <div class="prog-bar"><div class="prog-fill" id="ord-prog-fill"></div></div>
    <div class="card">
      <div style="font-size:0.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.75rem">단어를 순서대로 클릭하세요</div>
      <div class="sentence-en" id="ord-hint" style="font-size:1.1rem;color:var(--muted);margin-bottom:1rem"></div>
      <div class="assembled" id="assembled"><span class="assembled-empty">여기에 단어가 쌓입니다</span></div>
      <div class="chips" id="chips"></div>
      <div class="result" id="ord-result"></div>
      <div class="controls">
        <button class="btn btn-icon btn-tts" id="ord-tts-btn" onclick="speakOrd()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M19.07 4.93a10 10 0 010 14.14M15.54 8.46a5 5 0 010 7.07"/></svg>
          정답 듣기
        </button>
        <button class="btn" onclick="clearOrd()">초기화</button>
        <button class="btn btn-accent" onclick="checkOrd()">확인</button>
        <button class="btn" onclick="nextOrd()">다음 →</button>
      </div>
    </div>
  </div>

  <footer>Chrome에서 음성인식이 가장 잘 작동합니다 · 마이크 권한을 허용해주세요</footer>
</div>

<script>
const sentences = [
  { en: "I've been looking forward to this all week.", kr: "이번 주 내내 이걸 기대해왔어요.", level: "mid" },
  { en: "Could you please turn down the volume?", kr: "볼륨을 좀 줄여주시겠어요?", level: "easy" },
  { en: "She tends to overthink every small decision.", kr: "사소한 결정도 너무 깊이 생각하는 경향이 있어요.", level: "hard" },
  { en: "Let me know if you need anything.", kr: "필요한 게 있으면 알려줘요.", level: "easy" },
  { en: "That meeting could have been an email.", kr: "그 회의는 이메일로도 충분했을 거예요.", level: "mid" },
  { en: "I'm not sure what you're getting at.", kr: "무슨 말씀을 하시려는 건지 잘 모르겠어요.", level: "hard" },
  { en: "He showed up out of nowhere.", kr: "그가 갑자기 나타났어요.", level: "easy" },
  { en: "We need to think outside the box.", kr: "고정관념에서 벗어나 생각해야 해요.", level: "mid" },
  { en: "Things don't always go as planned.", kr: "일이 항상 계획대로 되는 건 아니에요.", level: "mid" },
  { en: "I was caught off guard by her question.", kr: "그녀의 질문에 당황했어요.", level: "hard" },
  { en: "The sooner, the better.", kr: "빠를수록 좋아요.", level: "easy" },
  { en: "It's easier said than done.", kr: "말은 쉽지만 실천은 어려워요.", level: "mid" },
  { en: "You should have told me earlier.", kr: "더 일찍 말해줬어야지요.", level: "mid" },
  { en: "I can't believe how fast time flies.", kr: "시간이 얼마나 빨리 가는지 믿기지 않아요.", level: "easy" },
  { en: "Don't take it personally.", kr: "개인적으로 받아들이지 마세요.", level: "easy" },
  { en: "That's completely out of the question.", kr: "그건 전혀 불가능한 얘기예요.", level: "hard" },
  { en: "She always manages to turn things around.", kr: "그녀는 항상 상황을 반전시키는 능력이 있어요.", level: "hard" },
  { en: "Just give it some time.", kr: "시간이 지나면 괜찮아질 거예요.", level: "easy" },
];

// state
let prIdx=0, flIdx=0, trIdx=0, ordIdx=0;
let flKrVisible=false;
let recognition=null, isRecording=false;
let ordAssembled=[], ordUsed=[];

// ── utils ──
function norm(s){ return s.toLowerCase().replace(/[^\w\s']/g,'').replace(/\s+/g,' ').trim(); }
function lev(a,b){
  const m=a.length,n=b.length,dp=Array.from({length:m+1},(_,i)=>Array.from({length:n+1},(_,j)=>i===0?j:j===0?i:0));
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++) dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]:1+Math.min(dp[i-1][j],dp[i][j-1],dp[i-1][j-1]);
  return dp[m][n];
}
function badgeClass(l){ return 'badge badge-'+(l==='easy'?'easy':l==='mid'?'mid':'hard'); }
function badgeTxt(l){ return l==='easy'?'기초':l==='mid'?'중급':'고급'; }
function updateProg(fillId, lineId, idx, total){
  document.getElementById(fillId).style.width = ((idx+1)/total*100)+'%';
  document.getElementById(lineId).textContent = (idx+1)+' / '+total;
}

// ── TTS ──
function speak(text, btnId, rate){
  if(!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const btn = btnId ? document.getElementById(btnId) : null;
  const utt = new SpeechSynthesisUtterance(text);
  utt.lang='en-US'; utt.rate=rate||0.9;
  utt.onstart=()=>btn&&btn.classList.add('playing');
  utt.onend=()=>btn&&btn.classList.remove('playing');
  utt.onerror=()=>btn&&btn.classList.remove('playing');
  window.speechSynthesis.speak(utt);
}
function speakPronun(){ speak(sentences[prIdx].en,'pr-tts-btn',parseFloat(document.getElementById('pr-speed').value)); }
function speakFlash(){ speak(sentences[flIdx].en,'fl-tts-btn',parseFloat(document.getElementById('fl-speed').value)); }
function speakTr(){ speak(sentences[trIdx].en,'tr-tts-btn',0.9); }
function speakOrd(){ speak(sentences[ordIdx].en,'ord-tts-btn',0.9); }

// ── STT ──
function toggleMic(){ isRecording ? stopMic() : startMic(); }
function startMic(){
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){
    document.getElementById('pr-transcript').textContent='이 브라우저는 음성인식을 지원하지 않아요. Chrome을 사용해주세요.';
    return;
  }
  recognition=new SR();
  recognition.lang='en-US'; recognition.interimResults=true; recognition.maxAlternatives=3;
  const micBtn=document.getElementById('pr-mic-btn');
  const transcEl=document.getElementById('pr-transcript');
  recognition.onstart=()=>{
    isRecording=true;
    micBtn.classList.add('recording');
    micBtn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="1" y1="1" x2="23" y2="23"/><path d="M9 9v3a3 3 0 005.12 2.12M15 9.34V4a3 3 0 00-5.94-.6"/><path d="M17 16.95A7 7 0 015 12v-2m14 0v2a7 7 0 01-.11 1.23M12 19v4M8 23h8"/></svg> 듣는 중…';
    transcEl.textContent='말씀해보세요…'; transcEl.classList.add('active');
    document.getElementById('score-area').style.display='none';
  };
  recognition.onresult=(e)=>{
    let final='',interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      e.results[i].isFinal ? final+=t : interim+=t;
    }
    transcEl.textContent=final||interim||'…';
    if(final) analyze(final.trim());
  };
  recognition.onerror=(e)=>{ stopMic(); transcEl.textContent=e.error==='not-allowed'?'마이크 권한을 허용해주세요.':'인식 오류. 다시 시도해보세요.'; };
  recognition.onend=()=>stopMic();
  recognition.start();
}
function stopMic(){
  isRecording=false;
  if(recognition){ try{recognition.stop();}catch(e){} }
  const btn=document.getElementById('pr-mic-btn');
  btn.classList.remove('recording');
  btn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="9" y="2" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v4M8 22h8"/></svg> 따라 말하기';
}
function analyze(spoken){
  const target=sentences[prIdx].en;
  const tw=norm(target).split(' ');
  const sw=norm(spoken).split(' ');
  let correct=0;
  const results=tw.map(w=>{
    const ok=sw.some(s=>s===w||lev(s,w)<=1);
    if(ok) correct++;
    return {word:w,ok};
  });
  const score=Math.round(correct/tw.length*100);
  const sEl=document.getElementById('score-num');
  sEl.textContent=score+'%';
  sEl.className='score-num '+(score>=90?'perfect':score>=65?'good':'poor');
  const desc=score===100?'완벽해요 🎉':score>=85?'거의 다 됐어요!':score>=60?'절반 이상 맞았어요':'더 연습해봐요';
  document.getElementById('score-desc').textContent=desc;
  const diffEl=document.getElementById('word-diff');
  diffEl.innerHTML='';
  results.forEach(r=>{
    const sp=document.createElement('span');
    sp.className='wd '+(r.ok?'wd-ok':'wd-wrong');
    sp.textContent=r.word; diffEl.appendChild(sp);
  });
  const wrong=results.filter(r=>!r.ok).map(r=>r.word);
  let fb='';
  if(score===100) fb='<strong>발음이 정확히 인식됐어요!</strong> 속도를 높여서 다시 도전해보세요.';
  else if(score>=85) fb=`<strong>아주 잘 하셨어요!</strong> ${wrong.length?'<strong>'+wrong.join(', ')+'</strong> 부분을 한 번 더 연습해보세요.':''}`;
  else if(score>=60) fb=`<strong>절반 이상 맞았어요.</strong> <strong>${wrong.slice(0,3).join(', ')}</strong> 단어 발음을 원어민 발음과 비교해보세요.`;
  else fb=`<strong>조금 더 연습이 필요해요.</strong> 원어민 발음을 천천히 들으면서 한 단어씩 따라해보는 걸 추천해요.`;
  document.getElementById('feedback').innerHTML=fb;
  document.getElementById('score-area').style.display='block';
}

// ── pronun nav ──
function updatePronun(){
  const s=sentences[prIdx];
  document.getElementById('pr-en').textContent=s.en;
  document.getElementById('pr-kr').textContent=s.kr;
  const b=document.getElementById('pr-badge');
  b.textContent=badgeTxt(s.level); b.className=badgeClass(s.level);
  updateProg('pr-prog-fill','pr-prog-line',prIdx,sentences.length);
  document.getElementById('pr-transcript').textContent='마이크 버튼을 누르고 문장을 말해보세요.';
  document.getElementById('pr-transcript').classList.remove('active');
  document.getElementById('score-area').style.display='none';
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  stopMic();
}
function nextPronun(){ prIdx=(prIdx+1)%sentences.length; updatePronun(); }

// ── flash nav ──
function updateFlash(){
  flKrVisible=false;
  const s=sentences[flIdx];
  document.getElementById('fl-en').textContent=s.en;
  document.getElementById('fl-kr').textContent=s.kr;
  document.getElementById('fl-kr').classList.remove('show');
  const b=document.getElementById('fl-badge');
  b.textContent=badgeTxt(s.level); b.className=badgeClass(s.level);
  updateProg('fl-prog-fill','fl-prog-line',flIdx,sentences.length);
}
function toggleFlKr(){ flKrVisible=!flKrVisible; document.getElementById('fl-kr').classList.toggle('show',flKrVisible); }
function nextFlash(){ flIdx=(flIdx+1)%sentences.length; updateFlash(); }

// ── translate nav ──
function updateTr(){
  document.getElementById('tr-kr').textContent=sentences[trIdx].kr;
  document.getElementById('tr-input').value='';
  document.getElementById('tr-result').className='result';
  updateProg('tr-prog-fill','tr-prog-line',trIdx,sentences.length);
}
function checkTr(){
  const inp=document.getElementById('tr-input').value;
  const res=document.getElementById('tr-result');
  if(norm(inp)===norm(sentences[trIdx].en)){
    res.className='result correct show'; res.textContent='정답이에요! ✓';
    speak(sentences[trIdx].en,'tr-tts-btn',0.9);
  } else {
    res.className='result wrong show'; res.textContent='아직 아니에요. 다시 시도하거나 정답을 확인해보세요.';
  }
}
function showTrAnswer(){
  const res=document.getElementById('tr-result');
  res.className='result neutral show'; res.textContent='정답: '+sentences[trIdx].en;
}
function nextTr(){ trIdx=(trIdx+1)%sentences.length; updateTr(); }

// ── order nav ──
function updateOrd(){
  ordAssembled=[]; ordUsed=[];
  const s=sentences[ordIdx];
  document.getElementById('ord-hint').textContent='뜻: '+s.kr;
  document.getElementById('ord-result').className='result';
  updateProg('ord-prog-fill','ord-prog-line',ordIdx,sentences.length);
  const words=s.en.replace(/[?.!,]/g,'').split(' ');
  const shuffled=[...words].sort(()=>Math.random()-0.5);
  const chipsEl=document.getElementById('chips');
  chipsEl.innerHTML='';
  shuffled.forEach((w,i)=>{
    const c=document.createElement('div');
    c.className='chip'; c.textContent=w; c.dataset.i=i;
    c.onclick=()=>addOrd(c,i,w);
    chipsEl.appendChild(c);
  });
  renderAssembled();
}
function renderAssembled(){
  const el=document.getElementById('assembled');
  el.innerHTML='';
  if(!ordAssembled.length){ el.innerHTML='<span class="assembled-empty">여기에 단어가 쌓입니다</span>'; return; }
  ordAssembled.forEach((w,i)=>{
    const sp=document.createElement('span');
    sp.className='a-word'; sp.textContent=w;
    sp.onclick=()=>removeOrd(i); el.appendChild(sp);
  });
}
function addOrd(chip,idx,word){ chip.classList.add('used'); ordUsed.push(idx); ordAssembled.push(word); renderAssembled(); }
function removeOrd(i){
  ordAssembled.splice(i,1);
  const ci=ordUsed[i]; ordUsed.splice(i,1);
  document.querySelectorAll('.chip').forEach(c=>{ if(parseInt(c.dataset.i)===ci) c.classList.remove('used'); });
  renderAssembled();
}
function clearOrd(){
  ordAssembled=[]; ordUsed=[];
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('used'));
  document.getElementById('ord-result').className='result';
  renderAssembled();
}
function checkOrd(){
  const answer=sentences[ordIdx].en.replace(/[?.!,]/g,'').split(' ').join(' ');
  const attempt=ordAssembled.join(' ');
  const res=document.getElementById('ord-result');
  if(norm(attempt)===norm(answer)){
    res.className='result correct show'; res.textContent='정답이에요! ✓';
    speak(sentences[ordIdx].en,'ord-tts-btn',0.9);
  } else {
    res.className='result wrong show'; res.textContent='순서가 맞지 않아요. 다시 시도해보세요.';
  }
}
function nextOrd(){ ordIdx=(ordIdx+1)%sentences.length; updateOrd(); }

// ── tabs ──
function switchTab(t){
  ['pronun','flash','translate','order'].forEach(name=>{
    document.getElementById('tab-'+name).style.display=name===t?'':'none';
  });
  document.querySelectorAll('.tab').forEach((el,i)=>{
    el.classList.toggle('active',['pronun','flash','translate','order'][i]===t);
  });
  if(window.speechSynthesis) window.speechSynthesis.cancel();
  stopMic();
}

// init
updatePronun(); updateFlash(); updateTr(); updateOrd();
</script>
</body>
